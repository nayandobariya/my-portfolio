services:
  - type: web
    name: portfolio-website
    runtime: python3
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn portfolio_website.wsgi:application"
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        fromSecret: django-secret-key
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        fromSecret: cloudinary-cloud-name
      - key: CLOUDINARY_API_KEY
        fromSecret: cloudinary-api-key
      - key: CLOUDINARY_API_SECRET
        fromSecret: cloudinary-api-secret

databases:
  - name: portfolio-db
    databaseName: portfolio
    user: portfolio
