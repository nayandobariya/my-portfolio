{% extends 'portfolio/admin/base.html' %}

{% block title %}{% if experience %}Edit{% else %}Add{% endif %} Experience - Admin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3>{% if experience %}Edit{% else %}Add{% endif %} Experience</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <input type="text" class="form-control" id="title" name="title" value="{{ experience.title|default:'' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="company" class="form-label">Company/Institution</label>
                        <input type="text" class="form-control" id="company" name="company" value="{{ experience.company|default:'' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="4" required>{{ experience.description|default:'' }}</textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="start_date" class="form-label">Start Date</label>
                            <input type="date" class="form-control" id="start_date" name="start_date" value="{{ experience.start_date|date:'Y-m-d'|default:'' }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="end_date" class="form-label">End Date</label>
                            <input type="date" class="form-control" id="end_date" name="end_date" value="{{ experience.end_date|date:'Y-m-d'|default:'' }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="is_current" name="is_current" {% if experience.is_current %}checked{% endif %}>
                            <label class="form-check-label" for="is_current">
                                Currently working here
                            </label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="is_education" name="is_education" {% if experience.is_education %}checked{% endif %}>
                            <label class="form-check-label" for="is_education">
                                This is education
                            </label>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'admin_experience_list' %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
