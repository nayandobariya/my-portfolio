{% extends 'portfolio/admin/base.html' %}

{% block title %}{% if post %}Edit{% else %}Add{% endif %} Blog Post - Admin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-10">
        <div class="card">
            <div class="card-header">
                <h3>{% if post %}Edit{% else %}Add{% endif %} Blog Post</h3>
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <input type="text" class="form-control" id="title" name="title" value="{{ post.title|default:'' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="excerpt" class="form-label">Excerpt</label>
                        <textarea class="form-control" id="excerpt" name="excerpt" rows="3" placeholder="Brief summary of the post">{{ post.excerpt|default:'' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label for="content" class="form-label">Content</label>
                        <textarea class="form-control" id="content" name="content" rows="10" required>{{ post.content|default:'' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label for="image" class="form-label">Featured Image</label>
                        <input type="file" class="form-control" id="image" name="image" accept="image/*">
                        {% if post.image %}
                            <small class="text-muted">Current image: <a href="{{ post.image.url }}" target="_blank">View</a></small>
                        {% endif %}
                    </div>
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="published" name="published" {% if post.published %}checked{% endif %}>
                            <label class="form-check-label" for="published">
                                Publish this post
                            </label>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'admin_blog_list' %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
