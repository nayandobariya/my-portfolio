{% extends 'portfolio/base.html' %}

{% block title %}{{ post.title }} - Blog{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <article>
                    <header class="mb-4">
                        <h1 class="mb-3">{{ post.title }}</h1>
                        <p class="text-muted">Published on {{ post.published_at|date:"F d, Y" }}</p>
                        {% if post.image %}
                            <img src="{{ post.image.url }}" alt="{{ post.title }}" class="img-fluid mb-4">
                        {% endif %}
                    </header>
                    <div class="content">
                        {{ post.content|safe }}
                    </div>
                </article>
                <div class="mt-4">
                    <a href="{% url 'blog' %}" class="btn btn-secondary">← Back to Blog</a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
